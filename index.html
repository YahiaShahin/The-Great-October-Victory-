<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نصر أكتوبر العظيم — Pixel Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="screen">
    <canvas id="game" width="320" height="180" tabindex="0"
            aria-label="The Great October Victory — pixel arcade game"></canvas>
    <div class="crt scan" aria-hidden="true"></div>
    <div class="crt vignette" aria-hidden="true"></div>
    <div class="crt flicker" aria-hidden="true"></div>
  </main>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script src="game.js"></script>
</body>
</html>
